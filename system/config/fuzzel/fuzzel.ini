# स्नेह Sneh launcher. Colours: colors.ini (sne theme set)
[main]
include=~/.config/fuzzel/colors.ini
font=Inter:size=13,Symbols Nerd Font Mono:size=13,Noto Sans Devanagari:size=13
prompt="स्नेह  "
placeholder=search apps
icons-enabled=no
terminal=footclient
layer=overlay
anchor=center
width=40
lines=8
horizontal-pad=24
vertical-pad=18
inner-pad=12
line-height=24
fields=filename,name,generic,keywords

[border]
width=1
radius=20
selection-radius=12
