# स्नेह Sneh lock (laptop profile). Colours: hyprlock-colors.conf (sne theme set)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = melt, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, melt
    animation = fadeOut, 1, 3, melt
    animation = inputFieldDots, 1, 2, melt
}

background {
    monitor =
    path = ~/.config/sneh/wallpaper.current
    color = $bg
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = Inter Light
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = $muted
    font_size = 14
    font_family = Inter
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    rounding = -1
    inner_color = $surface
    outer_color = $overlay
    check_color = $fg
    fail_color = $urgent
    font_color = $fg
    font_family = Inter
    placeholder_text = स्नेह
    fail_text = $FAIL
    fade_on_empty = false
    dots_spacing = 0.35
    position = 0, -40
    halign = center
    valign = center
}
