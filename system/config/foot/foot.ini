# स्नेह Sneh terminal (foot, run as a server: footclient)
include=~/.config/foot/colors.ini
font=Maple Mono NF:size=11, JetBrains Mono:size=11, Symbols Nerd Font Mono:size=11
pad=14x12 center
term=foot
selection-target=clipboard

[scrollback]
lines=4000

[cursor]
style=beam
blink=no
beam-thickness=1.5

[mouse]
hide-when-typing=yes
