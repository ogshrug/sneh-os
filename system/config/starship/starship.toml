# स्नेह Sneh prompt: quiet and fast.
add_newline = false
command_timeout = 300
scan_timeout = 20
format = "$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"

[hostname]
ssh_only = true
format = "[$hostname](bold #efb2a4) "

[directory]
truncation_length = 3
style = "#e6e2f7"

[git_branch]
format = "[$branch]($style) "
style = "#8b8fb8"

[git_status]
style = "#efb2a4"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "#8b8fb8"

[character]
success_symbol = "[›](#e6e2f7)"
error_symbol = "[›](#efb2a4)"
