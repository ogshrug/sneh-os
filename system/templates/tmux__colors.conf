# generated by `sne theme set {{name}}`
set -g status-style "bg=#{{bg}},fg=#{{muted}}"
set -g status-left "#[fg=#{{accent2}}]स्नेह #[fg=#{{fg}}]#S #[fg=#{{overlay}}]│ "
set -g status-right "#[fg=#{{accent2}}]#(sne bar tmux) #[fg=#{{overlay}}]│ #[fg=#{{muted}}]#(cut -d' ' -f1 /proc/loadavg) #[fg=#{{overlay}}]│ #[fg=#{{muted}}]SUPER+1 desk #[fg=#{{overlay}}]│ #[fg=#{{fg}}]%H:%M "
set -g status-right-length 90
set -g window-status-format "#[fg=#{{muted}}] #I #W "
set -g window-status-current-format "#[fg=#{{bg}},bg=#{{fg}}] #I #W "
set -g pane-border-style "fg=#{{overlay}}"
set -g pane-active-border-style "fg=#{{accent}}"
set -g message-style "bg=#{{surface}},fg=#{{fg}}"
set -g mode-style "bg=#{{overlay}},fg=#{{fg}}"
