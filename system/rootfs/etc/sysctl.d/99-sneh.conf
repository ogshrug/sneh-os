# Tuned for zram (see Arch wiki "Zram#Optimizing swap on zram").
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
kernel.nmi_watchdog = 0
# Flush dirty pages early and in small batches: no multi-second stalls on
# slow SATA/eMMC/USB disks while something big is being written.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 50331648
# Faster TCP for SSH/VNC on lossy Wi-Fi.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
