# Publishes website/ to GitHub Pages. The docs pages are generated from docs/*.md
# by website/build-docs.py; the job fails if they weren't rebuilt after an edit.
name: website
on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs pages are up to date
        run: |
          pip install markdown-it-py==4.0.0
          python website/build-docs.py --check
      - id: pages
        uses: actions/configure-pages@v5
      - name: Absolute URLs for link previews
        run: sed -i "s|%SITE_URL%|${{ steps.pages.outputs.base_url }}|g" website/*.html website/docs/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4
